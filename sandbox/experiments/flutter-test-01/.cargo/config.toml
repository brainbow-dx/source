[build]
target-dir = ".cargo/target"
rustc-wrapper = "sccache"

[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"

[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg",
    "getrandom_backend=\"wasm_js\"",
    "-C",
    "linker-plugin-lto",
]
env = { CARGO_HOME = "~/.cargo/wasm-home" }
runner = "wasm-pack"
