[package]
name = "eden-diffusion"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
std = []
micro = []
web = []
dev = []

#--
[dependencies]
rand = { workspace = true }
widestring = { workspace = true, features = ["alloc"] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry"] }
tracing-chrome = { workspace = true, features = [] }

image = { workspace = true }

tokenizers = { workspace = true, features = ["onig"] }

pyo3 = { workspace = true, features = [
    "macros",
    "uuid",
    "serde",
    "extension-module",
    "abi3",
    "auto-initialize",
    "experimental-async",
    "multiple-pymethods",
] }

[dev-dependencies]
clap = { workspace = true, features = ["std", "derive"] }
anyhow = { workspace = true }
eyre = { workspace = true }

# For the candle example:
candle-core = { workspace = true, features = [] }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
hf-hub = { workspace = true, features = ["tokio", "ureq"] }
