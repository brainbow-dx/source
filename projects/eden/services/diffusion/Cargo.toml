[package]
name = "eden-diffusion"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
std = []
micro = []
web = []
dev = []

#--
[dependencies]
rand = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry"] }
tracing-chrome = { workspace = true, features = [] }

image = { workspace = true }

tokenizers = { workspace = true, features = ["onig"] }


[dev-dependencies]
clap = { workspace = true, features = ["std", "derive"] }
anyhow = { workspace = true }
eyre = { workspace = true }

# For the candle example:
candle-core = { workspace = true, features = [] }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
hf-hub = { workspace = true, features = ["tokio", "ureq"] }
