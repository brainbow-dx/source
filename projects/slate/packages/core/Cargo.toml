[package]
name = "slate-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "macros", "bump"]
std = ["dep:tracing-subscriber"]
debug = []
verbose = []
profiling = []
macros = []
bump = []

[dependencies]
slate-macros = { workspace = true }

uuid = { workspace = true, features = ["v4"] }
once_cell = { workspace = true }
smallvec = { workspace = true }
hashbrown = { workspace = true, features = ["default", "nightly"] }
foldhash = { workspace = true }
ahash = { workspace = true }

dyn-clone = { workspace = true }

bumpalo = { workspace = true, features = [
    "allocator_api",
    "boxed",
    "collections",
] }
bumpalo-herd = { workspace = true }

enum_dispatch = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
], optional = true }
derive_more = { workspace = true, features = ["from"] }
oops = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt", "ansi"] }
