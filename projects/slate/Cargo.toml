[package]
name = "slate"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
opt-level = 3
codegen-units = 1
incremental = false
lto = true

[features]
default = ["std"]
std = ["slate-core/std"]
debug = ["slate-core/debug"]
verbose = ["slate-core/verbose"]
profiling = ["slate-core/profiling"]

#---
[dependencies]
slate-core = { workspace = true }
slate-macros = { workspace = true }
slate-syn = { workspace = true, optional = true }
slate-bevy = { workspace = true }
slate-terminal = { workspace = true }

[dev-dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi"] }
derive_more = { workspace = true, features = ["full"] }
anyhow = { workspace = true, features = ["default"] }
oops = { workspace = true, features = ["default"] }

#---
[workspace]
members = [
    "apps/hud",
    "apps/desktop",
    "apps/sketch",
    "packages/sketch/extensions/vscode",
    "packages/sketch/extensions/chrome",
    "packages/sketch/extensions/penpot",
    "packages/sketch/extensions/blender",
    "packages/core",
    "packages/jsx",
    "packages/macros",
    "packages/syn",
    "runtimes/bevy",
    "runtimes/terminal",
    "runtimes/unity",
    "runtimes/unreal",
    "services/etch-io",
]

[workspace.dependencies]
slate = { path = "." }
slate-hud = { path = "./apps/hud" }
slate-sketch = { path = "./apps/sketch" }
slate-core = { path = "./packages/core" }
slate-macros = { path = "./packages/macros" }
slate-syn = { path = "./packages/syn" }
slate-etch-io = { path = "./services/etch-io" }
slate-bevy = { path = "./runtimes/bevy" }
slate-terminal = { path = "./runtimes/terminal" }
slate-unity = { path = "./runtimes/unity" }
slate-unreal = { path = "./runtimes/unreal" }

#--
uuid = { version = "1.17", default-features = false }
smallvec = { version = "1.13", default-features = false }
once_cell = { version = "1.19", default-features = false }
derive_more = { version = "2.0", default-features = false }
parking_lot = { version = "0.12", default-features = false }
spin = { version = "0.10", default-features = false }

hashbrown = { version = "0.15", default-features = false }
foldhash = { version = "0.1", default-features = false }
ahash = { version = "0.8", default-features = false }

enum-iterator = { version = "2.1", default-features = false }
enum_dispatch = { version = "0.3", default-features = false }

dyn-clone = { version = "1.0", default-features = false }

bumpalo = { version = "3.19", default-features = false }
bumpalo-herd = { version = "0.1", default-features = false }

slotmap = { version = "1.0", default-features = false }

tokio = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false }

crossterm = { version = "0.29", default-features = false }
ratatui = { version = "0.29", default-features = false }

bevy = { version = "0.16", default-features = false }

winit = { version = "0.30", default-features = false }
dirs = { version = "6.0", default-features = false }

tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
tracy-client = { version = "0.18", default-features = false }

anyhow = { version = "1.0", default-features = false }
criterion = { version = "0.6", default-features = false }
oops = { git = "https://github.com/open-dx/oops-rs", default-features = false, features = ["macros"] }

bindgen = { version = "0.72", default-features = false }
cbindgen = { version = "0.29", default-features = false }
deno_bindgen = { version = "0.8", default-features = false }
cwrap = { git = "https://github.com/open-dx/cwrap-rs", default-features = false, features = ["macros"] }

proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false }
