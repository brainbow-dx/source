syntax = "proto3";

package slate.sketch.protocol;

//---
// TODO: Move to shared `.proto` ..
message Point {
  float x = 1;
  float y = 2;
}

//---
message SketchElement {
  string id = 1;
  string type = 2;
  repeated Point points = 3;
  string properties_json = 4;
}

//---
message ExtensionCommand {
  string correlation_id = 1;
  oneof command {
    RequestDocumentState request_document_state = 2;
    ModifyDocument modify_document = 3;
    ExecuteTool execute_tool = 4;
  }
}

//---
message RequestDocumentState {
  optional uint64 version = 1;
}

message ModifyDocument {
  enum ActionType {
    ACTION_TYPE_UNSPECIFIED = 0;
    ADD = 1;
    UPDATE = 2;
    DELETE = 3;
  }
  ActionType action = 1;
  optional SketchElement element = 2;
}

message ExecuteTool {
  string tool_name = 1;
  bytes tool_data = 2;
}

message CoreStateUpdate {
  uint64 document_version = 1;
  oneof update_type {
    DocumentState document_state = 2;
    IncrementalChange incremental_change = 3;
    SystemEvent system_event = 4;
  }
}

message DocumentState {
  repeated SketchElement elements = 1;
  map<string, string> metadata = 2;
}

message IncrementalChange {
  repeated SketchElement changed_elements = 1;
  repeated string deleted_element_ids = 2;
}

message SystemEvent {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    ERROR = 1;
    STATUS_MESSAGE = 2;
    CONNECTION_LOST = 3;
  }
  EventType type = 1;
  string message = 2;
}

//--
service SketchCoreService {
  rpc Connect(stream ExtensionCommand) returns (stream CoreStateUpdate);
}
