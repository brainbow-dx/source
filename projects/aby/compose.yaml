services:
  web-player:
    image: caddy:latest
    profiles: [web]
    ports:
      - 8094:80
    volumes:
      - ./spec/web/Caddyfile:/etc/caddy/Caddyfile
      - ./.output/web:/usr/share/caddy
  # `docker compose --profile docs watch` — serves docs/ (a real mdbook) at :8096 and keeps it
  # live: `develop.watch` syncs local edits into the container, mdbook's own file watcher then
  # rebuilds + live-reloads the served page. `docker compose --profile docs up` alone (no
  # `watch`) still works — it just serves whatever was present at image build time.
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    profiles: [docs]
    ports:
      - 8096:3000
    develop:
      watch:
        - path: ./docs
          action: sync
          target: /book
networks:
  default:
    # You can configure custom networks here if needed.
    # For a basic setup, the default bridge network is usually sufficient.
    # driver: bridge