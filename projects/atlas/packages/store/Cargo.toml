[package]
name = "atlas-store"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = ["std"]
std = ["tokio"]
micro = ["embassy"]
dev = []
verbose = []
inspect = []
profile = []
tokio = ["dep:parking_lot", "dep:tokio", "dep:async-lock"]
embassy = ["dep:spin"]

#--
[dependencies]
hashbrown = { workspace = true, features = ["default-hasher"] }

derive_more = { workspace = true, features = [
    "from",
    "display",
    "deref",
    "deref_mut",
] }

parking_lot = { version = "0.12", default-features = false, optional = true }
async-lock = { version = "3.4", default-features = false, optional = true }

spin = { version = "0.10", default-features = false, features = [
    "lock_api",
], optional = true }

tokio = { version = "1.38", default-features = false, features = [
    "sync",
    "rt",
    "macros",
], optional = true }
