services:
  # `docker compose --profile docs up` alone serves the static book built into the image at
  # :8096 (the Dockerfile's own release default). `docker compose --profile docs watch` instead
  # overrides the command to `mdbook serve`, which live-reloads: `develop.watch` syncs local
  # edits into the container, mdbook's own file watcher picks those up and rebuilds.
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    profiles: [docs]
    ports:
      - 8096:3000
    command: ["mdbook", "serve", "--hostname", "0.0.0.0", "--port", "3000"]
    develop:
      watch:
        - path: ./spec/docs
          action: sync
          target: /spec/docs
  # Local dev only, per this service's own bind-mount + cargo cache volumes below: builds the
  # Dockerfile's `builder` stage directly (it still has the full rustup toolchain, unlike the
  # release stage the plain `docker build` of this Dockerfile ends on) and overrides the command
  # to `cargo run`, so bind-mounted source edits actually take effect on restart. A real deploy of
  # this image builds the Dockerfile plainly instead, getting its own release-binary default.
  relay:
    build:
      context: .
      dockerfile: packages/relay/Dockerfile
      target: builder
    command: ["cargo", "run", "--example", "serve", "-p", "atlas-relay", "0.0.0.0:9200"]
    ports:
      - 9200:9200
    volumes:
      - .:/workspace
      - relay-cargo-registry:/usr/local/cargo/registry
      - relay-target:/workspace/target
volumes:
  relay-cargo-registry:
  relay-target:
