[package]
name = "atlas-dev"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = []
# Gates this crate's own `tracing` module (see its own doc comment on why) — off by default so
# a plain dependent doesn't get dragged into atlas-core's `dev`-gated tracing subscriber, which a
# `--release` build refuses to compile at all.
dev = ["atlas-core/dev"]
inspect = []

#---
[dependencies]
atlas-core = { workspace = true }

parking_lot = { workspace = true }

# slotmap = { workspace = true }
# indexmap = { workspace = true }

hashbrown = { workspace = true, features = ["default-hasher"] }



owo-colors = { workspace = true }

tracing = { workspace = true }

tower = { workspace = true, features = [] }

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
tower = { workspace = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
uuid = { workspace = true, features = ["v4", "js"] }
