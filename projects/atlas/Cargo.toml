[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = []
# Forwards to `atlas-core`'s own `dev` feature, which gates its self-flagged, `--release`-hostile
# `tracing` module (see that crate's own doc comment) — real consumers of `atlas::tracing`
# (`escher-terminal`'s `examples/ratatui.rs`) need to opt in explicitly through here now, rather
# than getting it (and its release-blocking `compile_error!`) unconditionally just for depending
# on this facade crate at all.
dev = ["atlas-core/dev"]
inspect = []
profiling = []

[dependencies]
atlas-core = { workspace = true }
atlas-relay = { workspace = true }
atlas-store = { workspace = true }
atlas-dev = { workspace = true }
atlas-home = { workspace = true }
atlas-pds = { workspace = true }
atlas-bsky = { workspace = true }

dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi"] }

#---
[dev-dependencies]
anyhow = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
libsql = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std"] }

#---
[workspace]
members = [
    "apps/monitor",
    "extensions/chrome",
    "extensions/vscode",
    "packages/core",
    "packages/relay",
    "packages/store",
    "services/dev",
    "services/bsky",
    "services/pds",
    "services/home",
]

[workspace.lints]
# TODO

[workspace.lints.rust]
# TODO

[workspace.lints.clippy]
# TODO

[workspace.lints.rustdoc]
# TODO

[workspace.dependencies]
atlas = { path = "." }
atlas-core = { path = "./packages/core" }
atlas-relay = { path = "./packages/relay" }
atlas-store = { path = "./packages/store" }
atlas-dev = { path = "./services/dev" }
atlas-home = { path = "./services/home" }
atlas-pds = { path = "./services/pds" }
atlas-bsky = { path = "./services/bsky" }

tower = { version = "0.5", default-features = false }
axum = { version = "0.8", default-features = false }

serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }

uuid = { version = "1.17", default-features = false }
once_cell = { version = "1.19", default-features = false }
parking_lot = { version = "0.12", default-features = false }
spin = { version = "0.10", default-features = false }
smallvec = { version = "1.13", default-features = false }
slotmap = { version = "1.0", default-features = false }
indexmap = { version = "2.10", default-features = false }
derive_more = { version = "2.0", default-features = false }

hashbrown = { version = "0.16", default-features = false }
allocator-api2 = { version = "0.2", default-features = false }

oops = { git = "https://github.com/open-dx/oops-rs", default-features = false, features = ["macros"] }
eyre = { version = "0.6", default-features = false }

owo-colors = { version = "4.2", default-features = false }
color-eyre = { version = "0.6", default-features = false }

clap = { version = "4.5", default-features = false }

criterion = { version = "0.8", default-features = false }

tracing = { version = "0.1", default-features = false }
tracing-core = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
tracy-client = { version = "0.18", default-features = false }

dirs = { version = "6.0", default-features = false }
anyhow = { version = "1.0", default-features = false }
rusqlite = { version = "0.37", default-features = false }
libsql = { version = "0.9.30" }
tokio = { version = "1.47", default-features = false }
