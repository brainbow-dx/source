[package]
name = "ethos-dev"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = ["dep:tracing-subscriber"]
debug = []
verbose = []
profiling = []

[dependencies]
ethos-log = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "fmt",
    "ansi",
    "env-filter",
], optional = true }
oops = { workspace = true }

dashmap = { workspace = true, features = ["serde"] }

serde = { workspace = true, features = ["derive"] }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
axum = { workspace = true, features = [
    "tokio",
    "query",
    "form",
    "json",
    "http1",
    "macros",
] }
tower = { workspace = true, features = [
    "balance",
    "discover",
    "filter",
    "tokio",
    "tokio-stream",
    "tokio-util",
    "tracing",
    "util",
] }

[dev-dependencies]
anyhow = { workspace = true, features = ["std", "backtrace"] }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi"] }
