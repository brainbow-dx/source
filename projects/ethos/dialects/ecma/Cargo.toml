[package]
name = "ethos-ecma"
version = "0.1.0"
edition = "2021"

#--
# The ECMAScript/TypeScript dialect: parsing and printing only, via `swc_core`. No execution —
# that's `ethos-deno`'s job (paired with this crate by `ethos-cli`, not a dependency between the
# two). This crate used to also own the whole runtime/FFI surface; that moved to `ethos-deno`.
[dependencies]
ethos-core = { workspace = true }

swc_core = { workspace = true, features = [
    "base",
    "common",
    "typescript",
    "ecma_ast",
    "ecma_codegen",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_loader",
] }
