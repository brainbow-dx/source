# Learn more: https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2
inputs:
  - directory: ../../spec/proto
clean: true
plugins:
  - local:
      [
        "deno",
        "run",
        "--allow-read",
        "--allow-env",
        "npm:@bufbuild/protoc-gen-es@2.9.0/",
      ]
    opt:
      - target=ts
      - import_extension=ts
    out: .output/pkg/protoc
    include_imports: true
