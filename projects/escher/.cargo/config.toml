[alias]
dev = "run --features dev"
# `examples/mario` needs `escher-bevy`'s `audio` feature (off by default, see that crate's
# `Cargo.toml`) for its sound effects; `cargo run --example mario` alone fails with a
# required-features error without this alias.
mario = "run -p escher-bevy --example mario --features audio"

#--
[build]
target-dir = ".cargo/target"
rustc-wrapper = "sccache"

[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"

[target.wasm32-unknown-unknown]
env = { CARGO_HOME = "~/.cargo/wasm-home" }
runner = "wasm-pack"
rustflags = [
    "--cfg",
    "getrandom_backend=\"wasm_js\"",
    "-C",
    "linker-plugin-lto",
]
