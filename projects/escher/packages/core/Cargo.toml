[package]
name = "escher-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["std", "macros"]
std = ["dep:tracing-subscriber", "tracing-subscriber/fmt", "tracing-subscriber/ansi"]
dev = []
verbose = []
profiling = []
macros = []

[dependencies]
escher-macros = { workspace = true }

# Only ever for `atlas::collections::OrderedMap` (see `scaffold.rs`) — depending on
# `atlas-core` directly instead of the full `atlas` facade crate, which unconditionally pulls in
# `atlas-relay`'s native-only `tokio`("net")/`mio` stack with no `wasm32` gating, breaking
# every wasm32 consumer of this crate (`escher-web`'s own build) despite never needing any of it.
atlas-core = { workspace = true }

uuid = { workspace = true, features = ["v4"] }
once_cell = { workspace = true }
smallvec = { workspace = true }
hashbrown = { workspace = true, features = ["default", "allocator-api2"] }
foldhash = { workspace = true }
ahash = { workspace = true }
palette = { workspace = true, features = ["libm"] }
ui-events = { workspace = true }

parking_lot = { workspace = true }

derive_more = { workspace = true, features = ["from"] }

num-traits = { workspace = true }
unicode-width = { workspace = true }

enum_dispatch = { workspace = true }

bumpalo = { workspace = true, features = [ "boxed", "collections", "allocator-api2"] }
bumpalo-herd = { workspace = true }
allocator-api2 = { workspace = true, features = ["alloc"] }

dyn-clone = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }

oops = { workspace = true }
eyre = { workspace = true }
color-eyre = { workspace = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
uuid = { workspace = true, features = ["v4", "js"] }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt", "ansi"] }
