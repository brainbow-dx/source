[package]
name = "escher-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["std", "macros"]
std = ["dep:tracing-subscriber", "tracing-subscriber/fmt", "tracing-subscriber/ansi"]
dev = []
verbose = []
profiling = []
macros = []

[dependencies]
escher-macros = { workspace = true }

# TODO: Remove this dependency.
atlas = { workspace = true }

uuid = { workspace = true, features = ["v4"] }
once_cell = { workspace = true }
smallvec = { workspace = true }
hashbrown = { workspace = true, features = ["default", "nightly"] }
foldhash = { workspace = true }
ahash = { workspace = true }
palette = { workspace = true, features = ["libm"] }
ui-events = { workspace = true }

parking_lot = { workspace = true }

derive_more = { workspace = true, features = ["from"] }

num-traits = { workspace = true }

enum_dispatch = { workspace = true }

bumpalo = { workspace = true, features = [ "boxed", "collections", "allocator_api"] }
bumpalo-herd = { workspace = true }

dyn-clone = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }

oops = { workspace = true }
eyre = { workspace = true }
color-eyre = { workspace = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
uuid = { workspace = true, features = ["v4", "js"] }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt", "ansi"] }
