[workspace]

[package]
name = "libsqlite3-sys"
version = "0.38.2"
edition = "2021"
build = "build.rs"

[lib]
name = "libsqlite3_sys"
path = "src/lib.rs"

[build-dependencies]
cc = "1"

# Every feature the real crate exposes, as inert no-ops — nothing here changes based on them,
# since this shim always exposes the one fixed FFI surface in `src/bindings.rs`. Declared only so
# Cargo doesn't error when a real dependent (rusqlite, via deno_kv/deno_cache/deno_node_sqlite/
# deno_webstorage) requests one of them; see `src/lib.rs`'s doc comment for why this crate exists
# at all instead of building the real one.
[features]
bundled = []
bundled_bindings = []
bundled-windows = []
bundled-sqlcipher = []
bundled-sqlcipher-vendored-openssl = []
buildtime_bindgen = []
column_metadata = []
in_gecko = []
loadable_extension = []
min_sqlite_version_3_34_1 = []
preupdate_hook = []
session = []
sqlcipher = []
unlock_notify = []
wasm32-wasi-vfs = []
with-asan = []
