[package]
name = "escher"
version = "0.0.0"
edition = "2024"
build = "scripts/build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["std", "ecma"]
std = ["escher-core/std"]
dev = ["escher-core/dev"]
verbose = ["escher-core/verbose"]
profiling = ["escher-core/profiling"]
terminal = ["escher-terminal"]
ecma = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
opt-level = 3
codegen-units = 1
incremental = false
lto = true

#---
[dependencies]
escher-core = { workspace = true }
escher-macros = { workspace = true }
escher-syn = { workspace = true, optional = true }
escher-bevy = { workspace = true }
escher-terminal = { workspace = true, optional = true }

atlas = { workspace = true }

prost = { workspace = true }
prost-types = { workspace = true }

# Bumpalo is the primary allocator used in the hot-path during scaffolding, via the stable
# allocator-api2 crate rather than nightly's own allocator_api.
bumpalo = { workspace = true, features = [
    "allocator-api2",
    "boxed",
    "collections",
] }
bumpalo-herd = { workspace = true }

#--
uuid = { workspace = true, features = ["v4"] }
parking_lot = { workspace = true }
derive_more = { workspace = true, features = [
    "from",
    "display",
    "index",
    "index_mut",
    "deref",
    "deref_mut",
    "is_variant",
] }
enum_dispatch = { workspace = true }
num-traits = { workspace = true }
hashbrown = { workspace = true, features = [
    "core",
    "alloc",
    "default-hasher",
    "serde",
    "allocator-api2",
    "rayon",
] }

tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

oops = { workspace = true, features = ["macros"] }
eyre = { workspace = true }
color-eyre = { workspace = true }
wasm-bindgen = { workspace = true, default-features = false }

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
escher-terminal = { workspace = true }
ratatui = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["events", "bracketed-paste"] }
ansi-to-tui = { workspace = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
uuid = { workspace = true, features = ["v4", "js"] }

[target.'cfg(target_os="windows")'.dependencies]
crossterm = { workspace = true, features = ["windows"] }

[dev-dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi"] }

hashbrown = { workspace = true, features = ["default-hasher"] }

# Only "display" is used (examples/events.rs). "full" also enables derive_more's own `Debug`
# derive, which can collide with a plain `#[derive(Debug)]` elsewhere in the workspace (E0659).
derive_more = { workspace = true, features = ["display"] }

eyre = { workspace = true, features = ["default"] }
oops = { workspace = true, features = ["default"] }

[build-dependencies]
prost-build = { workspace = true }
eyre = { workspace = true }
color-eyre = { workspace = true }
napi-build = { workspace = true }

#---
[workspace]
members = [
    "apps/anvil",
    "apps/desktop",
    "apps/hudd",
    "extensions/vscode",
    "extensions/chrome",
    "extensions/penpot",
    "extensions/blender",
    "packages/core",
    "packages/chalk",
    "packages/styleguide",
    "packages/edit",
    "packages/jsx",
    "packages/macros",
    "packages/syn",
    "runtimes/os",
    "runtimes/appkit",
    "runtimes/web",
    "runtimes/webview",
    "runtimes/bevy",
    "runtimes/terminal",
    "runtimes/unity",
    "runtimes/unreal",
]

[workspace.dependencies]
escher = { path = "." }
escher-anvil = { path = "./apps/anvil" }
escher-hud = { path = "./apps/hud" }
escher-desktop = { path = "./apps/desktop" }
escher-core = { path = "./packages/core" }
escher-chalk = { path = "./packages/chalk" }
escher-styleguide = { path = "./packages/styleguide" }
escher-edit = { path = "./packages/edit" }
escher-macros = { path = "./packages/macros" }
escher-syn = { path = "./packages/syn" }
escher-etch-io = { path = "./services/etch-io" }
escher-bevy = { path = "./runtimes/bevy" }
escher-terminal = { path = "./runtimes/terminal" }
escher-unity = { path = "./runtimes/unity" }
escher-unreal = { path = "./runtimes/unreal" }
escher-os = { path = "./runtimes/os" }
escher-appkit = { path = "./runtimes/appkit" }
escher-webview = { path = "./runtimes/webview" }

atlas = { path = "../atlas" }

#--
uuid = { version = "1.17", default-features = false, features = ["serde"] }
smallvec = { version = "1.13", default-features = false }
once_cell = { version = "1.19", default-features = false }
