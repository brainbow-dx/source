services:
  # www:
  #   profiles: [web]
  #   build:
  #     context: ./apps/www
  #     dockerfile: Dockerfile
  #   develop:
  #     watch:
  #       - path: ./apps/www
  #         target: /workspace/apps/www
  #         action: sync+restart
  #       - path: .
  #         target: /workspace
  #         action: sync+restart
  #   ports:
  #     - "8100:8000"
  web:
    build:
      # Repo root, not this directory. escher's Cargo workspace has a path dependency on
      # ../atlas, outside projects/escher.
      context: ../..
      dockerfile: projects/escher/runtimes/web/Dockerfile
    volumes:
      # Whole monorepo, matching --workspace below. Served/created pages map to real repo paths.
      - ../..:/workspace
      # Named volumes so toolchain/target/crate downloads survive a container restart.
      - web-cargo-target:/workspace/projects/escher/.cargo/target
      - web-cargo-registry:/usr/local/cargo/registry
      - web-wasm-cargo-home:/root/.cargo/wasm-home
    # Runs dev.tsx directly. deno task's arg passthrough doesn't reach Deno.args reliably.
    # --workspace /workspace roots served/created pages at the whole monorepo (required for
    # escher.brainbow.localhost, see Caddyfile, not just escher's own subproject).
    command: ["deno", "run", "-A", "--env-file", "./scripts/dev.tsx", "--workspace", "/workspace"]
    ports:
      # projects/escher/Caddyfile's escher.brainbow.localhost route hardcodes this port.
      - "3615:3615"
    restart: unless-stopped
  # `docker compose --profile docs up` builds the image (a real release binary/static book — the
  # Dockerfile's own default), but this service always overrides the command to `mdbook serve` and
  # bind-mounts spec/docs straight in — watch is on unconditionally the moment this service is up,
  # no separate `docker compose watch`/`--watch` invocation required. mdbook's own file watcher
  # sees host edits immediately through the bind mount and rebuilds + live-reloads.
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    profiles: [docs]
    ports:
      - 8096:3000
    command: ["mdbook", "serve", "--hostname", "0.0.0.0", "--port", "3000"]
    volumes:
      - ./spec/docs:/spec/docs
  db0:
    image: ghcr.io/tursodatabase/libsql-server:latest
    platform: linux/amd64
    ports:
      # sqld listens internally on 8080 (HTTP) and 5001 (gRPC), regardless of these env vars.
      - "5100:8080" # HTTP
      - "5101:5001" # gRPC
    environment:
      SQLD_NODE: primary
      SQLD_PRIMARY_URL: TODO
      SQLD_DB_PATH: db0
    volumes:
      - ./.output/data:/var/lib/sqld
  # `apps/anvil`'s local-LLM fallback (`commands/route.ts`'s `ANVIL_OLLAMA_URL`) — `anvil init`
  # brings this up (alongside `db0`) when neither is already reachable, so a fresh checkout
  # doesn't need Ollama installed on the host at all. Same default port Ollama's own client
  # libraries assume, so no env var override is needed on either side when this is what's running.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
  web-cargo-target:
  web-cargo-registry:
  web-wasm-cargo-home:

networks:
  default:
    # You can configure custom networks here if needed.
    # For a basic setup, the default bridge network is usually sufficient.
    # driver: bridge