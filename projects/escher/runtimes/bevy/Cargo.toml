[package]
name = "escher-bevy"
version = "0.0.0"
edition = "2024"

[features]
default = ["terminal"]
# `escher-terminal`'s real `Scaffold`-based UI, drawn to the OS terminal the Bevy app was
# launched from, alongside the game window, driven from Bevy's own schedule rather than a
# competing event loop. See `src/terminal.rs` and `src/legacy/README.md`.
terminal = ["dep:ratatui", "dep:crossterm", "dep:smallvec", "dep:escher-terminal", "dep:parking_lot"]
debug = []
verbose = []

[dependencies]
# See `apps/anvil/Cargo.toml`'s identical line for why `3d` is dropped from `bevy`'s own
# `default` (2d + 3d + ui) — nothing anywhere in this workspace renders 3D content.
bevy = { workspace = true, features = ["2d", "ui"] }
winit = { workspace = true }
tracing = { workspace = true }

escher-core = { workspace = true }
escher-webview = { workspace = true }
escher-os = { workspace = true }
bumpalo-herd = { workspace = true }

ratatui = { workspace = true, features = ["crossterm"], optional = true }
crossterm = { workspace = true, features = ["events", "bracketed-paste"], optional = true }
smallvec = { workspace = true, optional = true }
escher-terminal = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch="wasm32")'.dependencies]
uuid = { workspace = true, features = ["v4", "js"] }

[dev-dependencies]
clap = { workspace = true, features = ["std", "derive", "color", "help", "usage"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter", "fmt"] }
color-eyre = { workspace = true }
unicode-width = { workspace = true }

# `examples/mario` only, below this point.

tokio = { workspace = true, features = ["full"] }
libsql = { workspace = true }
uuid = { workspace = true, features = ["v5"] }

atlas = { workspace = true }
atlas-relay = { workspace = true }
webrtc = { workspace = true }
tokio-tungstenite = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
hostname = { workspace = true }
