[package]
name = "escher-terminal"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "ecma"]
std = ["tracing-subscriber", "palette/std"]
dev = []
verbose = []
profiling = []
ecma = []

#---
[dependencies]
escher-core = { workspace = true }

atlas = { workspace = true }

palette = { workspace = true }

uuid = { workspace = true, features = ["v4"] }
ratatui = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["events", "bracketed-paste"] }
ansi-to-tui = { workspace = true }

slotmap = { workspace = true }
indexmap = { workspace = true }

parking_lot = { workspace = true }

derive_more = { workspace = true, features = ["from", "display", "index", "index_mut", "deref", "deref_mut", "is_variant"] }
enum_dispatch = { workspace = true }

num-traits = { workspace = true }

hashbrown = { workspace = true, features = ["core", "alloc", "default-hasher", "serde", "nightly", "rayon"] }

bumpalo = { workspace = true, features = ["allocator_api", "boxed", "collections"] }
bumpalo-herd = { workspace = true }

tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

oops = { workspace = true, features = ["macros"] }
eyre = { workspace = true }
color-eyre = { workspace = true }

#--
[target.'cfg(target_os="windows")'.dependencies]
crossterm = { workspace = true, features = ["windows"] }

#--
[dev-dependencies]
clap = { workspace = true, features = ["std", "derive", "color", "help", "usage"] }

tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter", "fmt", "ansi"] }

tokio = { workspace = true, features = ["full"] }

axum = { workspace = true, features = ["tokio", "http1", "http2", "json", "query", "form", "multipart", "matched-path", "original-uri", "macros", "tower-log", "tracing"] }
tower = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["full"] }
