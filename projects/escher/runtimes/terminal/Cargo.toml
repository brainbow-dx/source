[package]
name = "escher-terminal"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "ecma"]
std = ["tracing-subscriber", "palette/std"]
dev = []
verbose = []
profiling = []
ecma = []

#---
[dependencies]
escher-core = { workspace = true }

palette = { workspace = true }

uuid = { workspace = true, features = ["v4"] }
ratatui = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["events", "bracketed-paste"] }
ansi-to-tui = { workspace = true }
arboard = { workspace = true }
unicode-width = { workspace = true }

slotmap = { workspace = true }
indexmap = { workspace = true }

parking_lot = { workspace = true }

derive_more = { workspace = true, features = ["from", "display", "index", "index_mut", "deref", "deref_mut", "is_variant"] }
enum_dispatch = { workspace = true }

num-traits = { workspace = true }

hashbrown = { workspace = true, features = ["core", "alloc", "default-hasher", "serde", "allocator-api2", "rayon"] }

bumpalo = { workspace = true, features = ["allocator-api2", "boxed", "collections"] }
bumpalo-herd = { workspace = true }

tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

oops = { workspace = true, features = ["macros"] }
eyre = { workspace = true }
color-eyre = { workspace = true }

#--
[target.'cfg(target_os="windows")'.dependencies]
crossterm = { workspace = true, features = ["windows"] }

#--
[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

#--
[dev-dependencies]
clap = { workspace = true, features = ["std", "derive", "color", "help", "usage"] }

tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter", "fmt", "ansi", "registry"] }

# Only `examples/ratatui.rs`'s own `atlas::tracing::TracingSubscriber` — never this crate's own
# `src/`, so this belongs here, not in `[dependencies]`; nothing else builds any part of `atlas`
# into `escher-terminal` itself. `dev`: see `atlas`'s own `Cargo.toml` for why this needs to be
# requested explicitly, not implied by depending on `atlas` at all.
atlas = { workspace = true, features = ["dev"] }
