[package]
name = "escher-web"
version = "0.1.0"
edition = "2024"
build = "scripts/build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
std = ["tracing-subscriber"]
dev = []
verbose = []
profiling = []

#---
[dependencies]
escher-core = { workspace = true }

uuid = { workspace = true, features = ["v4", "v5"] }

parking_lot = { workspace = true }

derive_more = { workspace = true, features = [
    "error",
    "from",
    "display",
    "index",
    "index_mut",
    "deref",
    "deref_mut",
    "is_variant",
] }
enum_dispatch = { workspace = true }

num-traits = { workspace = true }

hashbrown = { workspace = true, features = [
    "core",
    "alloc",
    "default-hasher",
    "serde",
    "allocator-api2",
    "rayon",
] }

bumpalo = { workspace = true, features = [
    "allocator-api2",
    "boxed",
    "collections",
] }
bumpalo-herd = { workspace = true }

tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

oops = { workspace = true, features = ["macros"] }
eyre = { workspace = true }
color-eyre = { workspace = true }

serde = { workspace = true, features = ["std"] }
# Needed on native too, not just wasm32. `description::parse` runs on both targets.
serde_json = { workspace = true, features = ["std"] }

wasm-bindgen = { workspace = true, features = [] }

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
crossterm = { workspace = true, features = ["events", "bracketed-paste"] }
ratatui = { workspace = true, features = ["crossterm"] }
ansi-to-tui = { workspace = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
uuid = { workspace = true, features = ["v4", "v5", "js"] }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "CssStyleDeclaration",
    "Node",
    "Window",
] }
js-sys = { workspace = true }

[target.'cfg(target_os="windows")'.dependencies]
crossterm = { workspace = true, features = ["windows"] }

#--
[dev-dependencies]
clap = { workspace = true, features = [
    "std",
    "derive",
    "color",
    "help",
    "usage",
] }

tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = [
    "std",
    "env-filter",
    "fmt",
    "ansi",
] }

tokio = { workspace = true, features = ["full"] }
axum = { workspace = true, features = [
    "tokio",
    "http1",
    "http2",
    "json",
    "query",
    "form",
    "multipart",
    "matched-path",
    "original-uri",
    "macros",
    "tower-log",
    "tracing",
] }
tower = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["full"] }
into-response = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }
eyre = { workspace = true }
